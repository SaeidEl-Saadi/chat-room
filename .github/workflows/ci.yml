name: Chat Room CI

on:
  push:
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t chat-room .

      - name: Validate Docker Compose
        run: docker compose config
      
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/saeidel-saadi/chat-room:${{ github.sha }}
      
      - name: Update Kubernetes image
        if: github.event_name != 'pull_request'
        run: |
          sed -i "s|image: ghcr.io/saeidel-saadi/chat-room:.*|image: ghcr.io/saeidel-saadi/chat-room:${{ github.sha }}|" kubernetes/chat-deployment.yaml
      
      - name: Commit Kubernetes image update
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/chat-deployment.yaml
          git commit -m "Update Kubernetes image to ${{ github.sha }}"
          git push

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: terraform

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform