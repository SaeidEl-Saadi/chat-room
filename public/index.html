<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body class="font-monospace">
    <div class="container">
        <h1>Chat</h1>
        <form id="joinForm">
            <div id="join" class="input-group mb-3">
                <input id="usernameInput" type="text" class="form-control" placeholder="Username" aria-label="Username"
                    aria-describedby="basic-addon1">
                <button id="joinButton" type="button" class="btn btn-custom" onclick="submitUsername()" disabled>Join
                    Chat</button>
            </div>
        </form>
        <div id="chatBox" hidden>
            <div id="messages">

            </div>

            <form id="messageForm">
                <div class="input-group mt-3">
                    <input id="messageInput" type="text" class="form-control" placeholder="Type a message...">

                    <button id="submit" class="btn btn-custom" onclick="sendMessage()" disabled>
                        Send
                    </button>
                </div>
            </form>

        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
